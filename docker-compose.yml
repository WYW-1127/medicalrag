# MedicalRAG 全栈一键部署：docker compose up -d
# 前置：仓库根目录有 .env（cp .env.example .env 并填入模型 API key）
# 端口：frontend 5182 / api 8000 / mysql 3307 / redis 6380 / milvus 19530（均已避开本机占用）
# 入库在宿主机执行：make ingest（走端口映射写入容器内 Milvus）
services:
  etcd:
    container_name: medicalrag-etcd
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio:
    container_name: medicalrag-minio
    image: docker.m.daocloud.io/minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    container_name: medicalrag-milvus
    image: docker.m.daocloud.io/milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  mysql:
    container_name: medicalrag-mysql
    image: docker.m.daocloud.io/library/mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: medicalrag
      MYSQL_DATABASE: medicalrag
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pmedicalrag"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    container_name: medicalrag-redis
    image: docker.m.daocloud.io/library/redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    container_name: medicalrag-api
    build: ./backend
    env_file:
      - .env  # 模型 API key 等
    environment:
      # 容器网络内连接串（覆盖 .env 的 localhost 值）
      DATABASE_URL: mysql+asyncmy://root:medicalrag@mysql:3306/medicalrag
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      start_period: 40s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  frontend:
    container_name: medicalrag-frontend
    build: ./frontend
    ports:
      - "5182:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  mysql_data:
  redis_data:

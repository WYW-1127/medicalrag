[project]
name = "medical-rag-backend"
version = "0.1.0"
description = "MedicalRAG backend —— 医学知识检索与问答 Copilot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "loguru>=0.7",
    "httpx>=0.27",
    "openai>=1.40",
    "tenacity>=8.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncmy>=0.2.9",
    "alembic>=1.13",
    "pymilvus>=2.5.3",
    "redis>=5.0",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S106"]
# alembic 自动生成的迁移代码，模板风格不适用项目规则
"alembic/versions/*" = ["E501", "I001", "UP035", "UP007"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymilvus.*", "asyncmy.*", "alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
